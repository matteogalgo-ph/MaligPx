name: maligpx

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.10
  - numpy
  - scipy
  - pandas
  - matplotlib
  - scanpy
  - anndata
  - scvelo
  - jupyterlab
  - ipykernel
  - networkx
  - python-igraph
  - leidenalg
  - scikit-learn
  - statsmodels

  - black
  - ruff
  - isort
  - pip
  - pip:
      - cellrank
      - scrublet
      - loompy
      - harmonypy
      - pingouin
      - gseapy

# This file defines the intended project environment.
#
# For exact package versions used in the project, see:
#   environment.lock.yml
#   requirements.txt
#
# CellRank and Scrublet are installed via pip because Windows Conda
# packages are presently unavailable or unsatisfiable.